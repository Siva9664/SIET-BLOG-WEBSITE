# QLoRA Fine-Tuning Configuration for Qwen3 14B -> SIET Editorial Intelligence Adapter
# Optimized for NVIDIA GeForce RTX 5070 (~12.2 GB VRAM)

model:
  base_model_name_or_path: "Qwen/Qwen3-14B"
  trust_remote_code: true
  torch_dtype: "bfloat16"
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  device_map: "auto"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "ml/training/qwen/outputs"
  checkpoint_dir: "ml/training/qwen/checkpoints"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  max_seq_length: 2048
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  logging_steps: 5
  eval_steps: 25
  save_steps: 50
  save_total_limit: 2
  seed: 42
  bf16: true
  fp16: false
  dataloader_num_workers: 2
  report_to: "none"

data:
  train_file: "ml/training/qwen/datasets/train.jsonl"
  val_file: "ml/training/qwen/datasets/val.jsonl"
  adversarial_file: "ml/training/qwen/datasets/adversarial_eval.jsonl"
  all_data_file: "ml/training/qwen/datasets/siet_editorial_sft.jsonl"
  val_split_ratio: 0.15
  random_seed: 42

system_instruction: >
  You are the editorial intelligence assistant for SIET (Sri Shakthi Institute of Engineering & Technology).
  STRICT GROUNDING RULES:
  1. Use ONLY supplied source / RAG context.
  2. Never invent names, dates, achievements, statistics, organizations, quotes, events, or other factual information.
  3. Missing information must be represented as null or empty values according to the requested schema.
  4. Do NOT fabricate content to fill a template.
