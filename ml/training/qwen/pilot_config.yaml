# SIET Qwen3 14B QLoRA Pilot Training Configuration
# Targeted for NVIDIA GeForce RTX 5070 (~12.2 GB VRAM)

model:
  base_model_name_or_path: "Qwen/Qwen3-14B"
  trust_remote_code: true
  torch_dtype: "bfloat16"
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  device_map: "auto"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "ml/training/qwen/checkpoints/pilot"
  checkpoint_dir: "ml/training/qwen/checkpoints/pilot"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_steps: 0
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  max_seq_length: 1024
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  logging_steps: 1
  save_steps: 10
  save_total_limit: 1
  seed: 42
  bf16: true
  fp16: false
  report_to: "none"

data:
  train_file: "ml/training/qwen/datasets/pilot_train.jsonl"
  val_file: "ml/training/qwen/datasets/val.jsonl"
  adversarial_file: "ml/training/qwen/datasets/adversarial_eval.jsonl"
